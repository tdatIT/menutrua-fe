# Included in every location that sets its own add_header (nginx does not
# inherit add_header into such blocks).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Styles need 'unsafe-inline': Astryx/StyleX set inline style props at runtime.
# If the API lives on another origin, add it to connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Uncomment once the site is served exclusively over HTTPS:
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
