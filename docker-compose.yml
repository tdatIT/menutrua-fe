# Local container runs for both environments.
#   docker compose up --build web        -> production build on :8080 (real API)
#   docker compose up --build web-dev    -> development build on :8081 (MSW mock API)
services:
  web:
    build:
      context: .
      args:
        APP_ENV: production
    image: menutrua-fe:latest
    ports:
      - '8080:8080'
    environment:
      # Point at your backend service (same compose network or host).
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web-dev:
    build:
      context: .
      args:
        APP_ENV: development
    image: menutrua-fe:dev
    ports:
      - '8081:8080'
    restart: unless-stopped
